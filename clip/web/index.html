<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Studio</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --panel2: #f8f6f2; --ink: #1d1b18; --muted: #6b665e;
  --line: #e2ddd4; --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --warn: #b45309;
  --err: #b91c1c; --code: #f1ede6; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141311; --panel: #1d1b19; --panel2: #232120; --ink: #ece8e1; --muted: #9c958a;
    --line: #34312d; --accent: #f97316; --accent-ink: #1a0f06; --ok: #4ade80; --warn: #fbbf24;
    --err: #f87171; --code: #262422; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
header .sp { flex: 1; }
select, input[type=text], input[type=number], textarea {
  font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; }
textarea { width: 100%; font-family: Consolas, monospace; font-size: 13px; }
button { font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 14px;
  border: 1px solid var(--line); background: var(--panel2); color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 57px); }
nav { border-right: 1px solid var(--line); padding: 16px 10px; background: var(--panel); }
nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none; cursor: pointer; margin-bottom: 2px; }
nav a:hover { background: var(--panel2); }
nav a.on { background: var(--panel2); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
nav .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; border: 1.5px solid var(--line); flex: none; }
nav .done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
nav .todo .n { border-color: var(--accent); color: var(--accent); }
main { padding: 24px 28px 160px; max-width: 1100px; }
h2 { margin: 0 0 4px; font-size: 22px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  margin-bottom: 16px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 10px; font-size: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.err { color: var(--err); border-color: currentColor; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center;
  color: var(--muted); cursor: pointer; transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); }
.drop b { color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
pre.code { background: var(--code); border-radius: 8px; padding: 12px; white-space: pre-wrap;
  font: 12.5px/1.45 Consolas, monospace; max-height: 320px; overflow: auto; margin: 8px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.opt { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.opt label { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.opt p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.opt select, .opt input[type=text], .opt input[type=number] { width: 100%; margin-top: 6px; }
.opt input[type=range] { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.planches { display: grid; gap: 16px; }
.planche { display: grid; grid-template-columns: 1fr 260px; gap: 16px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.vtile { display: block; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.vtile:hover, .vtile.on { border-color: var(--accent, #6aa0ff); }
.vtile img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 5px; display: block; }
.vtile .vt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
#job { position: fixed; left: 230px; right: 0; bottom: 0; background: var(--panel);
  border-top: 1px solid var(--line); padding: 10px 20px; z-index: 6; box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
#job.hide { display: none; }
#job .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0; }
#job .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
#job pre { margin: 6px 0 0; max-height: 150px; overflow: auto; font: 12px/1.4 Consolas, monospace;
  color: var(--muted); white-space: pre-wrap; }
#toast { position: fixed; top: 70px; right: 20px; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none; z-index: 9; max-width: 420px; }
#toast.on { opacity: 1; }
video { width: 100%; border-radius: 10px; background: #000; }
.steps-hint { background: var(--panel2); border-left: 3px solid var(--accent); padding: 10px 14px;
  border-radius: 6px; margin-bottom: 16px; }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; } nav { display: flex; overflow-x: auto; border-right: 0;
  border-bottom: 1px solid var(--line); } nav a span.t { display: none; } #job { left: 0; }
  .grid2, .planche { grid-template-columns: 1fr; } main { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Clip <span>Studio</span></h1>
  <select id="projet"></select>
  <button id="nouveau">+ Nouveau projet</button>
  <div class="sp"></div>
  <button id="dossier" title="Ouvrir le dossier du projet">📁 Dossier</button>
</header>
<div id="maj" style="display:none;background:#b45309;color:#fff;padding:10px 20px;font-weight:600">
  ⚠ Clip Studio a été mis à jour : ferme la fenêtre noire de Clip Studio et relance <u>Clip Studio.bat</u>,
  sinon certains boutons répondront « Action inconnue ».</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Chargement…</p></main>
</div>
<div id="job" class="hide">
  <div class="row"><b id="jobtitle"></b><span class="muted small" id="jobtime"></span>
    <div class="sp" style="flex:1"></div><button id="jobstop">Arrêter</button><button id="jobhide">Masquer</button></div>
  <div class="bar"><i id="jobbar"></i></div>
  <div class="small muted" id="jobprog"></div>
  <pre id="joblog"></pre>
</div>
<div id="toast"></div>
<input type="file" id="picker" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null, step = location.hash.slice(1) || localStorage.getItem("step") || "projet", polling = null;

const STEPS = [
  ["projet", "Projet", "Chanson et paroles"],
  ["preparer", "Préparer", "Beats et paroles calées"],
  ["descriptions", "Descriptions", "Scènes à illustrer"],
  ["planches", "Planches", "Images à générer"],
  ["videos", "Vidéos", "Animer des images (optionnel)"],
  ["options", "Options", "Effets et réglages"],
  ["rendu", "Rendu", "Aperçu et vidéo finale"],
  ["publication", "Publication", "Titre, description, miniature"],
];

function toast(msg, ms = 3200) { const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); }
async function api(url, opts = {}) {
  const r = await fetch(url, opts); const j = await r.json().catch(() => ({}));
  if (!r.ok || j.erreur) throw new Error(j.erreur || r.statusText); return j; }
const post = (url, body) => api(url, {method: "POST", body: typeof body === "string" ? body : JSON.stringify(body || {})});
const nom = () => $("#projet").value;
const file = p => `/fichier/${encodeURIComponent(nom())}/${p}?v=${Date.now()}`;

// ------------------------------------------------------------------ état des étapes
function stepState(k) {
  if (!S) return "";
  const allDesc = S.shots.length && S.shots.every(s => s.description);
  const allPl = S.planches.length && S.planches.every(p => p.fichier);
  return {
    projet: S.audio && S.paroles ? "done" : "todo",
    preparer: S.beats && S.words && S.shots.length ? "done" : (S.audio && S.paroles ? "todo" : ""),
    descriptions: allDesc ? "done" : (S.shots.length ? "todo" : ""),
    planches: allPl && S.planches.every(p => p.decoupees) ? "done" : (allDesc ? "todo" : ""),
    videos: S.clips.length ? "done" : "",
    options: "",
    rendu: S.videos.length ? "done" : (allPl ? "todo" : ""),
    publication: S.publication ? "done" : (S.videos.length ? "todo" : ""),
  }[k];
}
function renderNav() {
  $("#nav").innerHTML = STEPS.map(([k, t, d], i) =>
    `<a class="${k === step ? "on" : ""} ${stepState(k)}" data-k="${k}"><span class="n">${stepState(k) === "done" ? "✓" : i + 1}</span>
     <span class="t"><div>${t}</div><div class="small muted">${d}</div></span></a>`).join("");
  document.querySelectorAll("nav a").forEach(a => a.onclick = () => go(a.dataset.k));
}
function go(k) { step = k; localStorage.setItem("step", k); renderNav(); renderStep(); window.scrollTo(0, 0); }
function nextHint(k, txt) { return `<div class="row" style="margin-top:14px"><button class="primary" onclick="go('${k}')">${txt} →</button></div>`; }

// ------------------------------------------------------------------ chargement
async function loadProjects(select) {
  const list = await api("/api/projets");
  $("#projet").innerHTML = list.length ? list.map(n => `<option>${esc(n)}</option>`).join("")
    : `<option value="">(aucun projet)</option>`;
  const want = select || new URLSearchParams(location.search).get("projet") || localStorage.getItem("projet");
  if (want && list.includes(want)) $("#projet").value = want;
  await refresh();
}
async function checkVersion() {
  const r = await api("/api/version").catch(() => null);   // ancien serveur : route absente → bandeau aussi
  $("#maj").style.display = !r || r.perime ? "block" : "none";
}
async function refresh() {
  checkVersion();
  if (!nom()) { S = null; renderNav(); $("#main").innerHTML = `<h2>Bienvenue</h2>
    <p class="lead">Crée ton premier projet avec « + Nouveau projet ».</p>`; return; }
  localStorage.setItem("projet", nom());
  try { S = await api(`/api/projet/${encodeURIComponent(nom())}`); } catch (e) { toast(e.message); return; }
  renderNav(); renderStep();
}

// ------------------------------------------------------------------ tâches
async function run(cmd, args = [], label) {
  try { await post(`/api/projet/${encodeURIComponent(nom())}/run`, {cmd, args}); }
  catch (e) { toast(e.message); return; }
  $("#job").classList.remove("hide"); $("#jobtitle").textContent = label || cmd; pollJob();
}
function pollJob() {
  clearInterval(polling);
  polling = setInterval(async () => {
    const j = await api("/api/job").catch(() => null); if (!j) return;
    $("#jobtitle").textContent = (j.running ? "⏳ " : j.code === 0 ? "✅ " : "⚠️ ") + (j.label || "");
    $("#jobtime").textContent = ` · ${j.elapsed} s`;
    $("#jobbar").style.width = j.pct != null ? j.pct + "%" : (j.running ? "15%" : "100%");
    $("#jobprog").textContent = j.pct != null ? `Rendu : ${j.pct} %` : "";
    const log = $("#joblog"); log.textContent = j.lines.join("\n"); log.scrollTop = log.scrollHeight;
    $("#jobstop").disabled = !j.running;
    if (!j.running) {
      clearInterval(polling);
      await refresh();
      toast(j.code === 0 ? "Terminé ✅" : "Terminé avec un problème — voir le journal en bas", 4500);
    }
  }, 1000);
}

// ------------------------------------------------------------------ téléversement
function pick(accept, cb) { const p = $("#picker"); p.accept = accept; p.value = "";
  p.onchange = () => p.files[0] && cb(p.files[0]); p.click(); }
async function upload(type, f, id = "") {
  const url = `/api/projet/${encodeURIComponent(nom())}/upload?type=${type}&nom=${encodeURIComponent(f.name)}&id=${id}`;
  toast(`Envoi de ${f.name}…`);
  try { await api(url, {method: "POST", body: f}); toast(`${f.name} ajouté ✅`); await refresh(); }
  catch (e) { toast(e.message); }
}
// ------------------------------------------------------------------ coller une image (Ctrl+V / bouton)
let HOVER = null;                                   // zone de dépôt survolée : {type, id}
const imgFile = (blob, id) => new File([blob], `${id || "image"}.${(blob.type.split("/")[1] || "png").replace("jpeg", "jpg")}`,
  {type: blob.type || "image/png"});
async function readClipboardImage() {
  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error("Ce navigateur ne permet pas le bouton : utilise Ctrl+V");
  for (const item of await navigator.clipboard.read()) {
    const t = item.types.find(x => x.startsWith("image/"));
    if (t) return await item.getType(t);
  }
  throw new Error("Aucune image dans le presse-papiers (clic droit sur l'image → « Copier l'image »)");
}
function pasteTarget() {
  if (HOVER && HOVER.type !== "audio" && HOVER.type !== "paroles") return HOVER;
  if (step === "planches" && S) {
    const p = S.planches.find(p => !p.fichier);
    return p ? {type: "planche", id: p.id} : null;
  }
  if (step === "preparer" && S) {                   // première photo de solo encore vide
    const n = Math.max(S.solos_prompts.length, 1);
    for (let k = 1; k <= n; k++)
      if (!S.solos.some(f => f.toLowerCase().replace(/\.[^.]+$/, "") === `solo${k}`)) return {type: "solo", id: `solo${k}`};
    return null;
  }
  return null;
}
document.addEventListener("paste", e => {
  if (!S || ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName)) return;   // collage de texte normal
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (!item) return;
  e.preventDefault();
  const tgt = pasteTarget();
  if (!tgt) return toast(step === "planches" ? "Toutes les planches ont une image : survole la planche à remplacer puis Ctrl+V"
    : "Va à l'étape 4 (Planches) pour coller une planche");
  upload(tgt.type, imgFile(item.getAsFile(), tgt.id), tgt.id);
});

function dropzone(el, type, accept, id = "") {
  el.onclick = () => pick(accept, f => upload(type, f, id));
  el.onmouseenter = () => HOVER = {type, id};
  el.onmouseleave = () => { if (HOVER && HOVER.type === type && HOVER.id === id) HOVER = null; };
  if (accept.startsWith("image")) {                 // bouton « Coller » pour les zones d'image
    const b = document.createElement("button");
    b.textContent = "📋 Coller"; b.style.marginTop = "8px"; b.title = "Coller l'image copiée (ou Ctrl+V en survolant la zone)";
    b.onclick = async ev => { ev.stopPropagation();
      try { upload(type, imgFile(await readClipboardImage(), id), id); } catch (err) { toast(err.message, 5000); } };
    el.appendChild(document.createElement("br")); el.appendChild(b);
  }
  el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = e => { e.preventDefault(); el.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) upload(type, f, id); };
}
async function copy(txt) { await navigator.clipboard.writeText(txt); toast("Copié dans le presse-papiers ✅"); }

// ------------------------------------------------------------------ étapes
const V = {};
function renderStep() { if (!S) return; HOVER = null; $("#main").innerHTML = V[step](); (V[step + "_bind"] || (() => {}))(); }

V.projet = () => `
  <h2>1. Projet</h2><p class="lead">Dépose la chanson et ses paroles. Tout le reste en découle.</p>
  <div class="grid2">
    <div class="card"><h3>🎵 Chanson</h3>
      ${S.audio ? `<p><span class="pill ok">OK</span> ${esc(S.audio)}</p><audio controls src="${file(encodeURIComponent(S.audio))}" style="width:100%"></audio>` : ""}
      <div class="drop" id="dz-audio"><b>${S.audio ? "Remplacer" : "Déposer"} le fichier audio</b><br><span class="small">mp3, wav, m4a… (glisser ici ou cliquer)</span></div>
      ${S.audio && S.beats ? `<p class="small muted">Si tu changes l'audio, refais « Préparer » en cochant « tout refaire ».</p>` : ""}
    </div>
    <div class="card"><h3>📝 Paroles</h3>
      ${S.paroles ? `<p><span class="pill ok">OK</span> ${esc(S.paroles)}</p>` : ""}
      <div class="drop" id="dz-paroles"><b>${S.paroles ? "Remplacer" : "Déposer"} les paroles (.txt)</b><br>
        <span class="small">Un vers par ligne, sections entre crochets : [Verse 1], [Chorus]…</span></div>
    </div>
  </div>
  <div class="card"><h3>✏️ ${S.paroles ? "Modifier les paroles" : "Ou coller les paroles ici"}</h3>
    <p class="small muted">Un vers par ligne, une ligne vide entre les parties. En-têtes facultatifs : [Verse 1], [Chorus], [Bridge]…
      (sans en-têtes, les blocs répétés sont reconnus comme refrains).</p>
    <textarea id="lyr" rows="16" placeholder="[Verse 1]&#10;Premier vers&#10;Deuxième vers&#10;&#10;[Chorus]&#10;…">${esc(S.paroles_texte)}</textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="lyr-save">💾 Enregistrer les paroles</button>
      <span class="small muted" id="lyr-info"></span></div>
    ${S.words ? `<p class="small muted" style="margin-top:8px">⚠ Les paroles sont déjà calées sur la chanson : après une modification, refais « Préparer » en cochant « tout refaire ».</p>` : ""}
  </div>
  ${S.audio && S.paroles ? nextHint("preparer", "Étape suivante : Préparer") : ""}`;
V.projet_bind = () => {
  dropzone($("#dz-audio"), "audio", "audio/*,.mp3,.wav,.m4a,.flac,.ogg");
  dropzone($("#dz-paroles"), "paroles", ".txt,text/plain");
  const lyr = $("#lyr"), info = () => {
    const n = lyr.value.split(/\r?\n/).filter(l => l.trim() && !/^\s*\[.+\]\s*$/.test(l)).length;
    $("#lyr-info").textContent = n ? `${n} vers` : ""; };
  lyr.oninput = info; info();
  $("#lyr-save").onclick = async () => {
    const txt = lyr.value.replace(/\r\n/g, "\n").trim();
    if (!txt) return toast("Colle d'abord les paroles");
    if (txt === S.paroles_texte.replace(/\r\n/g, "\n").trim()) return toast("Aucun changement");
    const name = S.paroles || "paroles.txt";
    try {
      await api(`/api/projet/${encodeURIComponent(nom())}/upload?type=paroles&nom=${encodeURIComponent(name)}`,
        {method: "POST", body: txt + "\n"});
      toast(`Paroles enregistrées dans ${name} ✅`); await refresh();
    } catch (e) { toast(e.message); }
  };
};

V.preparer = () => {
  const n = S.shots.length, amb = S.shots.filter(s => s.ambiance).length;
  return `
  <h2>2. Préparer</h2><p class="lead">Détecte le rythme, cale chaque mot des paroles sur la voix, et calcule le nombre d'images à générer.</p>
  <div class="card"><h3>🎯 Intention de la chanson <span class="muted small">(recommandé)</span></h3>
    <p class="small muted">Explique à Claude ce que les paroles ne disent pas : il s'en servira pour l'évaluation, les descriptions de scènes et la publication.</p>
    <textarea id="intention" rows="5" maxlength="1500" placeholder="De quoi parle vraiment la chanson ? Premier ou second degré (ironie, hommage, colère, nostalgie) ?
Histoire vraie, contexte, époque, lieu ? Genre et énergie (punk, ballade, folk…) ?
Références visuelles souhaitées ? Ce qu'il faut éviter (personne réelle, violence, clichés…) ?">${esc(S.cfg.intention || "")}</textarea>
    <p class="small muted" style="margin:10px 0 4px">Style visuel des images (envoyé aussi au générateur d'images) :</p>
    <input type="text" id="style" value="${esc(S.cfg.style || "")}" style="width:100%">
    <div class="row" style="margin-top:10px"><button class="primary" id="int-save">💾 Enregistrer</button>
      <span class="small muted" id="int-info"></span></div>
    ${S.shots.some(s => s.description) ? `<p class="small muted" style="margin-top:8px">Descriptions déjà rédigées : pour qu'elles tiennent compte d'une nouvelle intention, relance la rédaction (étape 3) avec « tout réécrire ».</p>` : ""}
  </div>

const PRESET_KEYS = {ballade: "🎻 Ballade", rock: "🎸 Rock", sobre: "▫️ Sobre"};
function evalCard() {
  const E = S.evaluation;
  if (!E) return `<div class="card"><h3>🧠 Évaluation par Claude</h3>
    <p class="small muted">Claude analyse les passages sans paroles et recommande le nombre d'images d'ambiance, avec des idées de scènes.</p>
    ${CLAUDE ? `<button id="ev-go">🧠 Évaluer le storyboard</button>` : `<p class="small muted">Claude Code introuvable (voir étape 3).</p>`}</div>`;
  const F = E.faits, I = E.ia, applied = (S.cfg.ambiance || 0) === I.ambiance;
  const planches = n => n <= 0 ? 0 : Math.floor(n / 6) + (n % 6 ? 1 : 0);
  return `<div class="card"><h3>🧠 Évaluation par Claude</h3>
    <table class="small">
      <tr><td>Passages sans paroles</td><td>${F.passages_sans_paroles.map(t => `${t.type} ${t.duree} s`).join(" · ") || "aucun"}
        (total <b>${F.instrumental_total} s</b>)</td></tr>
      <tr><td>Photos de solo</td><td>${F.photos_de_solo}</td></tr>
      <tr><td>Recommandation</td><td><b>${I.ambiance}</b> image(s) d'ambiance → <b>${F.images_de_vers + I.ambiance}</b> images,
        <b>${planches(F.images_de_vers + I.ambiance)}</b> planche(s) ${applied ? '<span class="pill ok">appliquée</span>' : '<span class="pill warn">non appliquée</span>'}</td></tr>
      <tr><td>Préréglage conseillé</td><td>${PRESET_KEYS[I.preset] || esc(I.preset || "—")}</td></tr>
    </table>
    <p class="small" style="margin-top:10px">${esc(I.raison || "")}</p>
    ${(I.idees_ambiance || []).length ? `<p class="small muted" style="margin-bottom:4px">Idées pour les images d'ambiance :</p>
      <ol class="small" style="margin-top:0">${I.idees_ambiance.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${(I.remarques || []).length ? `<p class="small muted" style="margin-bottom:4px">Remarques :</p>
      <ul class="small" style="margin-top:0">${I.remarques.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <div class="row">
      ${applied ? "" : `<button class="primary" id="ev-apply">Appliquer ${I.ambiance} image(s) d'ambiance</button>`}
      ${PRESETS[PRESET_KEYS[I.preset]] ? `<button id="ev-preset">Appliquer le préréglage ${PRESET_KEYS[I.preset]}</button>` : ""}
      ${CLAUDE ? `<button id="ev-go">↻ Réévaluer</button>` : ""}</div>
    ${!applied ? (() => {
      const done = S.planches.filter(p => p.fichier).length, n0 = planches(F.images_de_vers + (S.cfg.ambiance || 0)),
            n1 = planches(F.images_de_vers + I.ambiance), full = (F.images_de_vers + (S.cfg.ambiance || 0)) % 6 === 0;
      if (!done) return "";
      return `<p class="small muted" style="margin-top:8px">Non appliquée automatiquement car ${done} planche(s) sont déjà générées.
        ${n1 > n0 && full ? `En l'appliquant, ${S.planches.map(p => p.id.toUpperCase()).join(", ")} restent inchangées :
          il faudra seulement générer ${Array.from({length: n1 - n0}, (_, i) => "P" + (n0 + i + 1)).join(" et ")}.`
          : `⚠ En l'appliquant, la dernière planche change : elle devra être régénérée.`}
        Sinon, garde le storyboard actuel : les passages sans paroles utilisent les photos de solo.</p>`; })() : ""}
  </div>`;
}

  if (type === "bool") return `<div class="opt"><label>${label} <label class="switch"><input type="checkbox" data-k="${k}" data-t="bool" ${v ? "checked" : ""}><span></span></label></label>${hp}</div>`;
  if (type.startsWith("range")) { const [, a, b, st] = type.split(":");
    return `<div class="opt"><label>${label} <span class="muted small" id="rv-${k}">${v ?? a}</span></label><input type="range" data-k="${k}" data-t="num" min="${a}" max="${b}" step="${st}" value="${v ?? a}"
      oninput="document.getElementById('rv-${k}').textContent=this.value">${hp}</div>`; }
  if (type.startsWith("select")) { const items = type.slice(7).split("|").map(x => [x.slice(0, x.indexOf("=")), x.slice(x.indexOf("=") + 1)]);
    const cur = k === "parallaxe" && v === true ? "0.03" : String(v === undefined || v === null ? (items.find(i => i[0] === "null") ? "null" : items[0][0]) : v);
    return `<div class="opt"><label>${label}</label><select data-k="${k}" data-t="sel">${items.map(([val, t]) =>
      `<option value="${val}" ${val === cur ? "selected" : ""}>${t}</option>`).join("")}</select>${hp}</div>`; }
  if (type === "tempo") return `<div class="opt"><label>${label}
      ${S.cfg.bpm_detecte ? `<span class="muted small">détecté : ${S.cfg.bpm_detecte}</span>` : ""}</label>
    <input type="text" data-k="${k}" data-t="tempo" value="${esc(v === undefined || v === null || v === "" ? "auto" : v)}" placeholder="auto">${hp}</div>`;
  if (type === "color") return `<div class="opt"><label>${label} <input type="color" data-k="${k}" data-t="txt" value="${esc(v || "#FFFFFF")}"></label>${hp}</div>`;
  if (type === "font") return `<div class="opt"><label>${label}</label><select data-k="${k}" data-t="sel">${FONTS.map(f =>
      `<option value="${f}" ${f === (v || "Arial") ? "selected" : ""} style="font-family:'${f}'">${f}</option>`).join("")}</select>${hp}</div>`;
  if (type === "logo") return `<div class="opt"><label>${label}</label>

  if (type === "psec") { const cur = S.cfg.particules_sections || {};
    return `<div class="opt" style="grid-column:1/-1"><label>${label}</label><div class="opts" style="margin-top:6px">${PSEC.map(([sk, sl]) =>
      `<div><span class="small">${sl}</span><select data-k="${sk}" data-t="psec" style="width:100%">${[["auto", "Réglage général"], ["aucune", "Aucune"], ["braises", "Braises"], ["etincelles", "Étincelles"], ["neige", "Neige"], ["pluie", "Pluie"], ["confettis", "Confettis"], ["bokeh", "Bokeh"], ["poussiere", "Poussière"]].map(([val, t]) =>
        `<option value="${val}" ${(cur[sk] || "auto") === val ? "selected" : ""}>${t}</option>`).join("")}</select></div>`).join("")}</div>${hp}</div>`; }
  if (type === "number") return `<div class="opt"><label>${label}</label><input type="number" step="0.1" data-k="${k}" data-t="num" value="${v ?? ""}">${hp}</div>`;
  return `<div class="opt"><label>${label}</label><input type="text" data-k="${k}" data-t="txt" value="${esc(v ?? "")}">${hp}</div>`;
}

  <div class="card"><h3>Préréglages</h3><div class="row">${Object.keys(PRESETS).map(p => `<button data-preset="${p}">${p}</button>`).join("")}</div>
    <p class="small muted">Un préréglage remplit le formulaire ; rien n'est enregistré avant « Enregistrer ».</p></div>
  ${OPTS.map(([g, list]) => `<div class="card"><h3>${g}</h3><div class="opts">${list.map(optInput).join("")}</div></div>`).join("")}
  <details class="card"><summary><b>Avancé</b> <span class="muted small">— cadrage par image, intro / outro</span></summary>
    <div class="opts" style="margin-top:12px">
      <div class="opt"><label>Image fixe sur l'intro</label><select data-k="intro_image" data-t="sel"><option value="null">(automatique)</option>
        ${S.shots.map(s => `<option ${S.cfg.intro_image === s.id ? "selected" : ""}>${s.id}</option>`).join("")}</select></div>
      <div class="opt"><label>Image fixe sur l'outro</label><select data-k="outro_image" data-t="sel"><option value="null">(automatique)</option>
        ${S.shots.map(s => `<option ${S.cfg.outro_image === s.id ? "selected" : ""}>${s.id}</option>`).join("")}</select></div>
    </div>
    <p class="small muted" style="margin-top:12px">Ajustements par image (JSON) — ex. <code>{"p2_c3": {"cy": 0.1}, "p4_c4": {"parallaxe": false, "particules": "braises", "fumee": "fumee"}}</code></p>
    <textarea id="adj" rows="5">${esc(JSON.stringify(S.cfg.ajustements || {}, null, 1))}</textarea></details>
  <div class="row"><button class="primary" id="save-opts">💾 Enregistrer les options</button>
    <button onclick="go('rendu')">Aller au rendu →</button></div>`;
function readOpts() {
  const out = {particules_sections: {}};
  document.querySelectorAll("#main [data-k]").forEach(el => {
    const k = el.dataset.k, t = el.dataset.t;
    if (t === "psec") { if (el.value !== "auto") out.particules_sections[k] = el.value; }
    else if (t === "tempo") { const n = parseFloat(el.value.replace(",", "."));
      out[k] = n >= 40 && n <= 240 ? n : "auto"; }
    else if (t === "bool") out[k] = el.checked;
    else if (t === "num") out[k] = el.value === "" ? null : +el.value;
    else if (t === "sel") { const v = el.value;
      out[k] = v === "null" ? null : v === "false" ? false : v === "true" ? true :
        (["format", "font"].includes(k) || isNaN(+v) || v === "" ? v : +v); }
    else out[k] = el.value.trim() || null;
  });
  const adj = $("#adj").value.trim();
  out.ajustements = adj ? JSON.parse(adj) : {};
  return out;
}
V.options_bind = () => {
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
    Object.entries(PRESETS[b.dataset.preset]).forEach(([k, v]) => {
      const el = document.querySelector(`#main [data-k="${k}"]`); if (!el) return;
      if (el.dataset.t === "bool") el.checked = !!v;
      else { el.value = String(v); el.dispatchEvent(new Event("input")); }
    });
    toast(`Préréglage ${b.dataset.preset} appliqué — pense à enregistrer`);
  });
  $("#dz-logo") && dropzone($("#dz-logo"), "logo", "image/png,image/webp,image/jpeg");
  $("#logo-del") && ($("#logo-del").onclick = async () => {
    await post(`/api/projet/${encodeURIComponent(nom())}/config`, {logo: null}); toast("Logo retiré"); refresh(); });
  $("#save-opts").onclick = async () => {
    let o; try { o = readOpts(); } catch (e) { return toast("Ajustements : JSON invalide"); }
    try { await post(`/api/projet/${encodeURIComponent(nom())}/config`, o); toast("Options enregistrées ✅"); await refresh(); }
    catch (e) { toast(e.message); }
  };
};

// ------------------------------------------------------------------ rendu
const size = b => b > 1e9 ? (b / 1e9).toFixed(2) + " Go" : (b / 1e6).toFixed(0) + " Mo";
V.rendu = () => {
  const ready = S.planches.length && S.planches.every(p => p.fichier);
  return `
  <h2>6. Rendu</h2><p class="lead">L'aperçu est rapide (petite taille) pour vérifier le montage ; le rendu final produit la vidéo 1080p avec le son.</p>
  ${ready ? "" : `<div class="steps-hint">Il manque des planches (étape 4) : le rendu utilisera les cases déjà découpées.</div>`}
  <div class="grid2">
    <div class="card"><h3>👁 Aperçu rapide</h3><p class="small muted">Vérif + découpe + montage + vidéo 960×540. Environ 1 minute.</p>
      <button class="primary" id="r-prev">▶ Aperçu</button></div>
    <div class="card"><h3>🎬 Rendu final</h3><p class="small muted">Vérif + découpe + montage + vidéo ${{"4k": "4K", "9:16": "verticale 9:16", "1:1": "carrée"}[S.cfg.format] || "1080p"} →
      <b>${esc(S.nom)}${{"4k": "_4k", "9:16": "_vertical", "1:1": "_carre"}[S.cfg.format] || ""}.mp4</b>. 1 à 3 minutes${S.cfg.format === "4k" ? " (4K : environ 4× plus)" : ""}.</p>
      <button class="primary" id="r-final">▶ Rendu final</button></div>
  </div>
  <div class="card"><h3>🔎 Aperçu d'un passage</h3>
    <p class="small muted">Vérifie vite un passage précis (karaoké, transition, effet) sans rendre toute la chanson.
      Utilise le montage actuel : fais au moins un aperçu rapide complet avant.</p>
    <div class="row"><label class="small">De <input type="text" id="pv-a" value="0:30" style="width:70px"></label>
      <label class="small">à <input type="text" id="pv-b" value="0:50" style="width:70px"></label>
      <button id="pv-go">▶ Aperçu du passage</button></div></div>
  <div class="card"><h3>Variante sous un autre nom</h3>
    <p class="small muted">Rend avec les options actuelles, sans refaire la découpe ni le montage — pratique pour comparer des réglages.</p>
    <div class="row"><input type="text" id="r-name" value="${esc(S.nom)}_variante" style="width:260px"><span class="muted">.mp4</span>
      <button id="r-var">▶ Rendre la variante</button></div></div>
  <label class="small"><input type="checkbox" id="r-force"> continuer même si la vérification des planches signale un problème</label>
  <div class="card" style="margin-top:16px"><h3>Vidéos du projet</h3>
    ${S.videos.length ? `<video id="player" controls src="${file("build/" + encodeURIComponent(S.videos[0].nom))}"></video>
      <table style="margin-top:10px">${S.videos.map(v => `<tr><td><a href="#" data-play="${esc(v.nom)}">${esc(v.nom)}</a></td>
        <td class="muted">${size(v.taille)}</td><td class="muted">${new Date(v.date * 1000).toLocaleString("fr-CA")}</td>
        <td style="white-space:nowrap"><button data-open="build/${esc(v.nom)}" title="Ouvrir dans le lecteur vidéo">▶ Ouvrir</button>
          <button data-reveal="${esc(v.nom)}" title="Afficher le fichier dans l'explorateur">📁 Dossier</button>
          <button data-del="${esc(v.nom)}" title="Supprimer cette vidéo">🗑 Supprimer</button></td></tr>`).join("")}</table>`
      : `<p class="muted">Aucune vidéo pour l'instant.</p>`}</div>`;
};
V.rendu_bind = () => {
  const f = () => $("#r-force").checked ? ["--force"] : [];
  $("#r-prev").onclick = () => run("build-preview", f(), "Aperçu rapide");
  $("#r-final").onclick = () => run("build", f(), "Rendu final");
  const secs = s => { const p = s.trim().split(":").map(Number); return p.some(isNaN) ? NaN : p.reduce((a, x) => a * 60 + x, 0); };
  $("#pv-go").onclick = () => {
    const a = secs($("#pv-a").value), b = secs($("#pv-b").value);
    if (!(b > a && a >= 0)) return toast("Plage invalide (ex. de 1:20 à 1:45)");
    run("preview", ["--start", a.toFixed(2), "--duration", Math.min(600, b - a).toFixed(2)], `Aperçu de ${$("#pv-a").value} à ${$("#pv-b").value}`);
  };
  $("#r-var").onclick = () => { const n = $("#r-name").value.trim().replace(/\.mp4$/i, "");
    if (!/^[\w\-]+$/.test(n)) return toast("Nom : lettres, chiffres, - et _ seulement");
    run("render", ["--out", n + ".mp4"], `Rendu de ${n}.mp4`); };
  document.querySelectorAll("[data-play]").forEach(a => a.onclick = e => { e.preventDefault();
    $("#player").src = file("build/" + encodeURIComponent(a.dataset.play)); $("#player").play(); });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () =>
    post(`/api/projet/${encodeURIComponent(nom())}/ouvrir?chemin=${encodeURIComponent(b.dataset.open)}`).catch(e => toast(e.message)));
  document.querySelectorAll("[data-reveal]").forEach(b => b.onclick = () =>
    post(`/api/projet/${encodeURIComponent(nom())}/reveler?nom=${encodeURIComponent(b.dataset.reveal)}`).catch(e => toast(e.message)));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const v = b.dataset.del;
    if (!confirm(`Supprimer définitivement « ${v} » ?\n(La vidéo pourra être recréée avec un nouveau rendu.)`)) return;
    const player = $("#player");
    if (player && decodeURIComponent(player.src).includes("/" + v)) { player.pause(); player.removeAttribute("src"); player.load(); }
    try { await post(`/api/projet/${encodeURIComponent(nom())}/supprimer-video?nom=${encodeURIComponent(v)}`);
      toast(`${v} supprimée ✅`); await refresh(); }
    catch (e) { toast(e.message, 5000); }
  });
};

// ------------------------------------------------------------------ publication
const ORIGINES = {
  suno: "Chanson originale réinterprétée avec Suno (IA) + images IA",
  images: "Musique originale (sans IA), seules les images sont IA",
  complete: "Chanson et images entièrement créées par IA",
};
V.publication = () => {
  const P = S.publication, c = S.cfg;
  const bloc = (id, titre, txt, rows) => `<div class="card"><div class="row"><h3 style="margin:0">${titre}</h3>
    <div style="flex:1"></div><button class="primary" data-cpy="${id}">📋 Copier</button></div>
    <textarea id="${id}" rows="${rows}" style="margin-top:10px">${esc(txt)}</textarea></div>`;
  return `
  <h2>7. Publication YouTube</h2><p class="lead">Claude rédige le titre, l'accroche et la miniature ; les chapitres, les paroles et la mention IA sont ajoutés automatiquement, exacts.</p>
  <div class="card"><h3>Informations</h3><div class="opts">
    <div class="opt"><label>Titre de la chanson</label><input type="text" id="pub-titre" value="${esc(c.titre || "")}"></div>
    <div class="opt"><label>Artiste / groupe</label><input type="text" id="pub-artiste" value="${esc(c.artiste || "")}"></div>
    <div class="opt"><label>Origine (mention IA)</label><select id="pub-origine">${Object.entries(ORIGINES).map(([k, t]) =>
      `<option value="${k}" ${(c.origine || "suno") === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  </div>
  <div class="row" style="margin-top:12px"><input type="text" id="pub-consigne" placeholder="Consigne facultative : ex. ton plus sérieux, miniature avec le disque d'or…" style="flex:1;min-width:260px">
    ${CLAUDE ? `<button class="primary" id="pub-go">✨ ${P ? "Refaire" : "Rédiger"} avec Claude</button>`
      : `<span class="muted small">Claude Code introuvable (voir étape 3)</span>`}</div></div>
  ${P ? `
    ${bloc("pub-t", "Titre", P.titre, 2)}
    ${bloc("pub-d", "Description", P.description, 18)}
    ${bloc("pub-m", "Prompt de miniature (avec texte)", P.miniature, 8)}
    ${bloc("pub-m2", "Prompt de miniature (sans texte)", P.miniature_sans_texte, 6)}
    <p class="small muted">Tu peux retoucher les textes ici avant de les copier (les modifications ne sont pas enregistrées).</p>` : ""}
  <div class="card"><h3>Avant de publier</h3><ul class="small">
    <li>Vérifie l'orthographe du texte sur la miniature générée (sinon, génère la version sans texte).</li>
    <li>Dans YouTube Studio, coche <b>« Contenu modifié ou synthétique »</b> (voix et images générées).</li>
    <li>Suno : l'offre gratuite n'autorise pas l'usage commercial (monétisation) ; les offres payantes oui.</li>
    <li>Vérifie les chapitres à l'oreille : ils viennent du calage des paroles.</li></ul></div>`;
};
V.publication_bind = () => {
  document.querySelectorAll("[data-cpy]").forEach(b => b.onclick = () => copy($("#" + b.dataset.cpy).value));
  $("#pub-go") && ($("#pub-go").onclick = async () => {
    const titre = $("#pub-titre").value.trim(), artiste = $("#pub-artiste").value.trim();
    if (!titre || !artiste) return toast("Renseigne le titre et l'artiste");
    await post(`/api/projet/${encodeURIComponent(nom())}/config`, {titre, artiste, origine: $("#pub-origine").value});
    const cns = $("#pub-consigne").value.trim();
    run("publish", cns ? ["--consigne", cns.slice(0, 300)] : [], "Rédaction de la publication");
  });
};

// ------------------------------------------------------------------ démarrage
$("#projet").onchange = refresh;
$("#nouveau").onclick = async () => {
  const n = prompt("Nom du nouveau projet (lettres, chiffres, - et _ ; sans espaces) :"); if (!n) return;
  try { await post("/api/projets", {nom: n.trim()}); await loadProjects(n.trim()); go("projet"); toast("Projet créé ✅"); }
  catch (e) { toast(e.message, 5000); }
};
$("#dossier").onclick = () => nom() && post(`/api/projet/${encodeURIComponent(nom())}/ouvrir?chemin=.`).catch(e => toast(e.message));
$("#jobhide").onclick = () => $("#job").classList.add("hide");
$("#jobstop").onclick = () => post(`/api/projet/${encodeURIComponent(nom())}/stop`);
api("/api/claude").then(r => { CLAUDE = r.chemin; if (["preparer", "descriptions", "planches", "videos", "publication"].includes(step)) renderStep(); }).catch(() => {});
loadProjects().then(async () => { const j = await api("/api/job").catch(() => null);
  if (j && j.running) { $("#job").classList.remove("hide"); pollJob(); } });
</script>
</body>
</html>
