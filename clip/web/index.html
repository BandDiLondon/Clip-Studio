<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Studio</title>
<link rel="icon" href="/web/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/web/logo.png">
<link rel="apple-touch-icon" href="/web/logo.png">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header>
  <h1><img class="logo" src="/web/logo.png" alt="">Clip <span>Studio</span></h1>
  <select id="projet"></select>
  <button id="nouveau">+ Nouveau projet</button>
  <div class="sp"></div>
  <select id="lang" title="Langue / Language" aria-label="Langue / Language"></select>
  <button id="dossier" title="Ouvrir le dossier du projet">📁 Dossier</button>
</header>
<div id="maj" style="display:none;background:#b45309;color:#fff;padding:10px 20px;font-weight:600">
  ⚠ Clip Studio a été mis à jour : ferme la fenêtre noire de Clip Studio et relance <u>Clip Studio.bat</u>,
  sinon certains boutons répondront « Action inconnue ».</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Chargement…</p></main>
</div>
<div id="job" class="hide">
  <div class="row"><b id="jobtitle"></b><span class="muted small" id="jobtime"></span>
    <div class="sp" style="flex:1"></div><button id="jobstop">Arrêter</button><button id="jobhide">Masquer</button></div>
  <div class="bar"><i id="jobbar"></i></div>
  <div class="small muted" id="jobprog"></div>
  <pre id="joblog"></pre>
</div>
<div id="toast"></div>
<input type="file" id="picker" hidden>

<script src="/web/app.js"></script>
</body>
</html>
