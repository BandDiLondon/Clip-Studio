name: Signaler un problème
description: Quelque chose ne marche pas dans Clip Studio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Projet personnel : la réponse arrive au mieux, sans délai garanti.
        Avant d'envoyer, regarde la section **Dépannage** du [guide](../blob/main/docs/GUIDE.md).
  - type: input
    id: version
    attributes:
      label: Version de Clip Studio
      placeholder: "1.3.4"
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: Système
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu / Debian)
        - Linux (WSL)
        - Autre
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Ce que tu faisais, ce que tu attendais, ce qui s'est passé.
    validations:
      required: true
  - type: textarea
    id: erreur
    attributes:
      label: Message d'erreur
      description: Le texte affiché dans Clip Studio ou dans la fenêtre noire.
      render: text
  - type: textarea
    id: check
    attributes:
      label: Résultat de la vérification
      description: "Sortie de `.venv\\Scripts\\python -m clip check` (Windows) ou `.venv/bin/python -m clip check` (Linux)."
      render: text
