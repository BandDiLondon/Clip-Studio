# Lance les tests sous Windows, Linux et macOS à chaque envoi sur main et à chaque pull request,
# puis un essai complet (installateur + vraie vidéo) sous Linux et macOS.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Installation identique à Installer.bat / installer.sh (torch CPU, requirements.txt, RapidOCR sans dépendances)
      - name: Dépendances
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = macOS ]; then
            python -m pip install torch==2.14.0 torchaudio==2.11.0
          else
            python -m pip install torch==2.14.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt
          python -m pip install --no-deps rapidocr==3.9.2

      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest -v

  # Comme un utilisateur : installer.sh sur une machine neuve, puis chanson synthétique → aperçu vidéo contrôlé
  essai-complet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/whisper
          key: whisper-small

      - name: Installation (installer.sh)
        run: bash installer.sh

      - name: Voix de synthèse
        run: |
          texte="Le soleil se lève sur la ville. Les voitures roulent sans bruit. Chante avec nous ce soir.
          Chante encore une fois. La pluie tombe sur les toits. Le vent souffle dans la nuit.
          Chante avec nous ce soir. Chante encore une fois."
          if [ "$RUNNER_OS" = macOS ]; then
            voix=$(say -v '?' | awk '/fr_FR/ {print $1; exit}')
            say ${voix:+-v "$voix"} -r 140 -o voix.aiff "$texte"; f=voix.aiff
          else
            sudo apt-get install -y -qq espeak-ng
            espeak-ng -v fr -s 120 -w voix.wav "$texte"; f=voix.wav
          fi
          ls -la "$f" && echo "VOIX=$f" >> "$GITHUB_ENV"

      - name: Essai complet (préparer, découper, rendre un aperçu)
        run: .venv/bin/python scripts/essai_complet.py "$VOIX"

      - name: Essai complet en anglais (chanson en anglais, messages en anglais)
        run: |
          texte="The sun is rising on the town. The cars are rolling without a sound. Sing along with us tonight.
          Sing it one more time. The rain is falling on the roofs. The wind is blowing through the night.
          Sing along with us tonight. Sing it one more time."
          if [ "$RUNNER_OS" = macOS ]; then
            voix=$(say -v '?' | awk '/en_US/ {print $1; exit}')
            say ${voix:+-v "$voix"} -r 150 -o voice_en.aiff "$texte"; f=voice_en.aiff
          else
            espeak-ng -v en -s 130 -w voice_en.wav "$texte"; f=voice_en.wav
          fi
          .venv/bin/python scripts/essai_complet.py "$f" --langue en
