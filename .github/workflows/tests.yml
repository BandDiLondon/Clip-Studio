# Lance les tests sous Windows et Linux à chaque envoi sur main et à chaque pull request.
# Installation identique à Installer.bat / installer.sh (torch CPU, requirements.txt, RapidOCR sans dépendances).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps rapidocr==3.9.2

      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest -v
