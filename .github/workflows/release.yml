# Crée une Release avec un zip Windows et un zip Linux, à chaque étiquette de version (ex. v1.0.0).
#   git tag v1.0.0 && git push origin v1.0.0
# Le code est le même dans les deux zips ; seuls les scripts propres à l'autre système sont retirés.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fabriquer les deux zips
        run: |
          set -e
          mkdir -p dist stage/win stage/linux
          commun=(--exclude ".git" --exclude ".git/*" --exclude ".github/*" --exclude "*.wsb" --exclude "dist/*" --exclude "stage" --exclude "docs" --exclude "scripts")
          # Windows : sans les scripts Linux
          rsync -a "${commun[@]}" --exclude "*.sh" ./ "stage/win/Clip-Studio/"
          # Linux : sans les scripts Windows ni l'OCR Windows
          rsync -a "${commun[@]}" --exclude "*.bat" --exclude "clip/ocr.ps1" ./ "stage/linux/Clip-Studio/"
          chmod +x stage/linux/Clip-Studio/*.sh
          (cd stage/win && zip -qr "../../dist/Clip-Studio-${GITHUB_REF_NAME}-Windows.zip" Clip-Studio)
          (cd stage/linux && zip -qr "../../dist/Clip-Studio-${GITHUB_REF_NAME}-Linux.zip" Clip-Studio)
          ls -la dist
          unzip -l "dist/Clip-Studio-${GITHUB_REF_NAME}-Windows.zip" | grep -c "\.sh$" && exit 1 || true
          unzip -l "dist/Clip-Studio-${GITHUB_REF_NAME}-Linux.zip" | grep -c "\.bat$" && exit 1 || true

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Téléchargement

          | Système | Fichier | Installation |
          |---|---|---|
          | **Windows 10 / 11** | \`Clip-Studio-${GITHUB_REF_NAME}-Windows.zip\` | décompresser, double-clic sur **Installer.bat**, puis **Clip Studio.bat** |
          | **Linux** (Ubuntu, Debian…) | \`Clip-Studio-${GITHUB_REF_NAME}-Linux.zip\` | décompresser, \`bash installer.sh\`, puis \`./clip-studio.sh\` |

          Environ 5 Go de mémoire vive sont nécessaires pour caler les paroles (Whisper « medium »).
          Documentation : [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Clip Studio ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
